<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="/css/styles.css">
        <script src="/js/index.js"></script>
        <title>TraditionalTesting</title>
    </head>
    <body>
        <div class="container">
            <br>
            <h2>Testing Area</h2>
            <p class="mb-0 me-3">
                Hit 'Ctrl' to toggle the Bubble Cursor. <strong>Hit 'Enter' to proceed to the next trial</strong> | [<span id="trial-counter">Trial 1 out of 20</span>]
            </p>
            <hr>
            <div id="demo-area"></div>
        </div>

        <button id="next-trial-btn" class="btn btn-primary"
                style="position: fixed; left: calc(50% + 620px + 1rem); top: calc(150px + 315px); transform: translateY(-50%); z-index: 1000;">Next Trial</button>
    </body>
</html>
