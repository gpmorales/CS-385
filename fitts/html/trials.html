<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <link rel="stylesheet" href="/css/fitts.css">
      <script src="/js/fitts.js"></script>
      <title>Trials</title>
    </head>
    <body>
        <div class="container" style="max-width: 400px; position: absolute; top: 10px; left: 10px; z-index: 2;">
            <br>
            <div id="taskInfo" class="alert alert-info">
                <p>Trial: <span id="trialCounter">1</span>/15</p>
                <p>Current Circle Size: <span id="circleArea">-</span>px</p>
                <p>Distance from Center: <span id="distance">-</span>px</p>
            </div>
            <button type="button" class="btn btn-primary" id="finish" onclick="location.href='summary.html'" hidden="hidden">Finish</button>
        </div>
        <div id="targets" style="position: relative; z-index: 1;"></div>
    </body>
</html>
