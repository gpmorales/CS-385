<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css" />
    <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/index.js" defer></script>
    <script src="/js/phrases.js" defer></script>
    <title>Testing</title>
</head>

<body>
    <br />
    <div class="container">
        <div class="row center">
            <h2>Testing Area</h2>
            <br />
            <hr />
        </div>
    </div>
    <br />

    <div id="phrase-display" style="
            border: 2px solid #ccc;
            padding: 15px;
            width: 500px;
            margin: 0 auto 20px auto;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
        "></div>

    <input type="text" id="text-output" class="form-control" placeholder="Your swipe text will appear here..." style="
            border: 1px solid #ccc;
            width: 500px;
            height: 150px;
            margin: 50px auto;
        " readonly />

    <div class="simple-keyboard" id="keyboard-container" style="width: 900px; margin: 50px auto"></div>

    <div style="
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 20px;
        ">
        <button id="next-trial-btn" class="btn btn-primary" onclick="getNextPhrase();">
            Next Phrase
        </button>
    </div>

    <svg id="cursor-trail-svg" style="
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        "></svg>
</body>

</html>
