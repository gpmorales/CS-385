<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css" />
    <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/index.js" defer></script>
    <script src="/js/phrases.js" defer></script>
    <title>Training</title>
</head>

<body>
    <br />
    <div class="container">
        <div class="row center">
            <h2>Swipe Training Area</h2>
            <br />
            <hr />
        </div>
    </div>
    <br />

    <div id="phrase-display" style="
            border: 2px solid #ccc;
            padding: 20px;
            width: 500px;
            margin: 0 auto 20px auto;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
          "></div>

    <input type="text" id="text-output" class="form-control" placeholder="Your swipe text will appear here..."
           style="
            border: 1px solid #ccc;
            width: 500px;
            height: 70px;
            margin: 40px auto;
          " readonly />

    <div style="position: relative; max-width: 1200px; margin: 0 auto;">
        <div class="simple-keyboard" id="keyboard-container"></div>
        <div style="
        position: absolute; 
        top: 50%;
        right: -160px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
    ">
            <button id="next-trial-btn" class="btn btn-primary" style="height: 47px;" onclick="getNextPhrase();">
                Next Phrase
            </button>
            <button id="generate-targets-btn" class="btn btn-secondary" style="height: 47px;" onclick="location.href='SwipeTesting.html'">
                Start Trials
            </button>
        </div>
    </div>

    <svg id="cursor-trail-svg" style="
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
          "></svg>
</body>

</html>
