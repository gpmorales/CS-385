<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css">
        <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>
        <link rel="stylesheet" href="/css/styles.css">
        <script src="/js/index.js"></script>
        <title>Training</title>
    </head>
    <body>
        <br>
        <div class="container">
            <div class="row center">
                <h2>Training Area</h2>
                <br>
                <hr>
            </div>
        </div>
        <input type="text" id="text-output" class="form-control" style="width: 500px; height: 300px; margin: 20px auto;" readonly>

        <div class="simple-keyboard" id="keyboard-container" style="width: 900px; margin: 50px auto;"></div>

        <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 20px;">
            <button id="generate-targets-btn" class="btn btn-secondary"
                    onclick="location.href='testing.html'">
                Start Trials
            </button>
            <button id="next-trial-btn" class="btn btn-primary"
                    onclick="generateRandomRectangles('demo-area', { width: 800, height: 500 });">
                Next Phrase
            </button>
        </div>

        <svg id="cursor-trail-svg" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;"></svg>
    </body>
</html>
