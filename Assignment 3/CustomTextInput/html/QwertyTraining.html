<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/index.js" defer></script>
  <script src="/js/phrases.js" defer></script>
  <title>QwertyTraining</title>
</head>

<body>
  <br />
  <div class="container">
    <br />
    <div class="row center">
      <h2>QWERTY Training Area</h2>
      <hr />
    </div>
  </div>
  <br />

  <div id="phrase-display" style="
              border: 2px solid #ccc;
              padding: 20px;
              width: 500px;
              margin: 0 auto 20px auto;
              text-align: center;
              font-size: 1.2rem;
              font-weight: bold;
              border-radius: 8px;
              transform: translateY(4rem);
            "></div>

  <input type="text" id="text-output" class="form-control" placeholder="Select to use QWERTY keyboard to enter text here..."
         style="
              border: 1px solid #ccc;
              width: 600px;
              height: 80px;
              margin: 40px auto;
              transform: translateY(4.7rem);
            " />
  <br>

  <div style="
              display: flex;
              justify-content: center;
              gap: 20px;
              margin: 0 auto;
              transform: translateY(4.5rem);
            ">
    <button id="next-trial-btn" class="btn btn-primary" style="height: 75px; width: 120px;" onclick="getNextPhrase();">
      Next Training Phrase
    </button>
    <button id="generate-targets-btn" class="btn btn-secondary" style="height: 75px; width: 120px" onclick="location.href='QwertyTesting.html'">
      Start Trials
    </button>
  </div>

</body>
</html>
