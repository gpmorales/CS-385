<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="/css/styles.css">
        <script src="/js/index.js"></script>
        <title>Testing</title>
    </head>
    <body>
        <br>
        <div class="container">
            <h2>Testing Area</h2>
            <hr>
            <div id="demo-area"></div>
        </div>

        <button id="next-trial-btn" class="btn btn-primary"
                style="position: fixed; left: calc(50% + 620px + 1rem); top: calc(150px + 315px); transform: translateY(-50%); z-index: 1000;">Next Trial</button>

        <button type="button" class="btn btn-primary" id="finish-btn"
                style="position: fixed; left: calc(50% + 620px + 1rem); top: calc(150px + 315px); transform: translateY(-50%); z-index: 1000;" hidden="hidden">Finish</button>

        <svg id="bubble-pull-visual" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;">
            <path id="pull-curve" d="" />
        </svg>

    </body>
</html>
