<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="/css/styles.css">
        <script src="/js/index.js"></script>
        <title>BubbleTraining</title>
    </head>
    <body>
        <br>
        <div class="container">
            <div class="row center">
                <h2>Training Area</h2>
                <br>
                <hr>
                <p class="mb-0 me-3">
                    Hit 'Ctrl' to toggle ON/OFF the Bubble Cursor. Select ONLY 'Green' Circles (these are our targets). When comfortable, proceed to the Test Trials.
                </p>
            </div>
        </div>

        <div id="demo-area"
             style="margin-top: 50px; margin-left: -85px; height: 530px !important; width: 1050px !important;"></div>

        <button id="next-trial-btn" class="btn btn-primary"
                onclick="location.href='BubbleTesting.html'"
                style="position: fixed; left: calc(50% + 470px); top: calc(425px); transform: translateY(-50%); z-index: 1000;">Start Trials</button>

        <button id="generate-targets-btn" class="btn btn-secondary"
                onclick="generateRandomTargets('demo-area', { height: 530, width: 1050 });"
                style="position: fixed; left: calc(50% + 470px); top: calc(375px); transform: translateY(-50%); z-index: 1000;">Generate New Targets</button>

        <svg id="bubble-pull-visual" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;">
            <path id="pull-curve" d="" />
        </svg>

    </body>
</html>
