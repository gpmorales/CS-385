<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/fitts.css">
    <script src="/js/fitts.js"></script>
    <title>Summary</title>
</head>
<body>
<div class="container">
    <br>
    <h1>Summary of Results</h1>
    <br>
    <p>**Note that the 'Target Position' and 'Click Position' refer to the CENTER coordinates of the circle!</p>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Trial #</th>
                <th>Target Size (px)</th>
                <th>Distance (px)</th>
                <th>Time (ms)</th>
                <th>Hit?</th>
                <th>Misses</th>
                <th>Target Position (x,y)</th>
                <th>Click Position (x,y)</th>
                <th>Accuracy (%)</th>
            </tr>
            </thead>
            <tbody id="resultsTable"></tbody>
        </table>
    </div>
    <button id="downloadCSV" class="btn btn-primary mb-3">Download Results CSV</button>
</div>
</body>
</html>
